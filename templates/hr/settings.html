<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Settings — TalentTrack ATS</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="navbar">
  <div class="navbar-container">
    <span class="nav-brand">TalentTrack ATS</span>
    <div class="nav-menu">
      <a href="{{ url_for('hr.dashboard') }}">Dashboard</a>
      <a href="{{ url_for('hr.view_jobs') }}">Jobs</a>
      <a href="{{ url_for('hr.candidates') }}">Candidates</a>
      <a href="{{ url_for('auth.logout') }}" class="btn-logout">Logout</a>
    </div>
  </div>
</nav>

<div class="container" style="max-width:600px;">
  <div class="page-header"><h1>Settings</h1></div>
  <div class="card">
    <div class="card-header">Account Details</div>
    <table class="kv-table">
      <tr><td>Name</td><td>{{ session.name }}</td></tr>
      <tr><td>Email</td><td>{{ session.email }}</td></tr>
      <tr><td>Role</td><td>HR / Recruiter</td></tr>
    </table>
  </div>
</div>
</body>
</html>
